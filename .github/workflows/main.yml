name: CI Pipeline

on:
  push:
    branches: [nphp]
  pull_request:
    branches: [nphp]

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: echo "tag=nphp" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build --build-arg GH_TOKEN=${{ secrets.GITHUB_TOKEN }} -t ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }} .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}
